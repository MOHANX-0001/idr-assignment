<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Isometric cube: top face (white), left face (black/dark), right face (orange) -->
  <!-- Top face -->
  <polygon points="40,8 68,24 40,40 12,24" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Left face -->
  <polygon points="12,24 40,40 40,64 12,48" fill="#1A1A1A" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Right face (orange accent) -->
  <polygon points="40,40 68,24 68,48 40,64" fill="#F05A1A" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Inner detail lines on top face -->
  <line x1="40" y1="8" x2="40" y2="40" stroke="#0A0A0A" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.4"/>
  <!-- Highlight edge -->
  <line x1="40" y1="40" x2="40" y2="64" stroke="#FF7235" stroke-width="1" opacity="0.5"/>
</svg>
